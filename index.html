    <style>
        body {
            font-family: 'Noto Serif TC', serif;
            background-color: #0F0518;
            color: #E2E8F0;
            overflow-y: auto; 
            touch-action: manipulation;
            margin: 0;
            padding: 0;
            padding-bottom: 80px; /* 預留底部空間給播放器 */
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* --- 戳戳樂格子樣式 --- */
        .poke-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            width: 100%;
            max-width: 340px;
            margin: 0 auto;
            perspective: 1000px;
        }

        .poke-cell {
            position: relative;
            aspect-ratio: 1;
            cursor: pointer;
            border-radius: 50%;
            transform-style: preserve-3d;
            transition: transform 0.3s;
        }

        .poke-cell:active {
            transform: scale(0.95);
        }

        /* 封印紙 */
        .poke-paper {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 30%, #FCD34D, #B45309);
            border: 2px solid #FEF3C7;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 0 10px rgba(255,255,255,0.3);
            z-index: 2;
            transition: all 0.3s ease;
        }
        
        .poke-paper::after {
            content: attr(data-n);
            font-family: 'Varela Round', sans-serif;
            font-size: 28px;
            color: #78350F;
            font-weight: bold;
            opacity: 0.9;
            text-shadow: 0 1px 0 rgba(255,255,255,0.4);
        }

        /* 戳破後的洞 */
        .poke-hole {
            position: absolute;
            inset: 0;
            background: #1E1B2E;
            border-radius: 50%;
            border: 2px solid #4B5563;
            box-shadow: inset 0 0 15px #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        .broken .poke-paper {
            transform: scale(1.2);
            opacity: 0;
            pointer-events: none;
        }

        .poke-content {
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            color: #FEF3C7;
            font-weight: bold;
            font-family: 'Varela Round', sans-serif;
            text-shadow: 0 0 5px #FCD34D;
            font-size: 1.5rem;
        }

        .broken .poke-content {
            opacity: 1;
            transform: scale(1);
        }

        /* 背景星星動畫 */
        @keyframes star-twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 0.8; transform: scale(1.2); }
        }
        .animate-twinkle { animation: star-twinkle 4s infinite; }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .animate-float { animation: float 6s ease-in-out infinite; }

        .pop-in {
            animation: pop 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* --- YouTube 播放器樣式 --- */
        .yt-player-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #1E1B2E;
            border-top: 1px solid rgba(139, 92, 246, 0.3);
            z-index: 100;
            transition: transform 0.3s ease-in-out;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
        }

        .yt-player-container.minimized {
            transform: translateY(calc(100% - 44px)); /* 只露出標題列 */
        }

        .yt-header {
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: rgba(139, 92, 246, 0.1);
            cursor: pointer;
            backdrop-filter: blur(5px);
        }

        .yt-content {
            width: 100%;
            height: 200px; /* 影片高度 */
            background: #000;
        }

        /* 隱藏原生捲軸但保留功能 */
        .yt-player-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

    </style>
</head>

                title: "釋放「不屬於你的責任」", 
                code: "你在正確的道路上，繼續保持。", 
                whisper: "你背負了太多別人的課題。717 告訴你，當你設立健康的界線，回歸自己的中心時，這才是最正確的道路。交還責任，是對彼此靈魂最大的尊重。",
                action: "將借來的東西歸還給對方，或是把不屬於你的物品清出你的空間。"
            }
        ];

        // 背景星星
        const starsContainer = document.getElementById('stars-container');
        for (let i = 0; i < 60; i++) {
            const star = document.createElement('div');
            star.className = 'absolute rounded-full bg-white animate-twinkle';
            star.style.width = Math.random() * 2 + 'px';
            star.style.height = star.style.width;
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            star.style.opacity = Math.random() * 0.7;
            star.style.animationDelay = Math.random() * 5 + 's';
            star.style.animationDuration = Math.random() * 3 + 2 + 's';
            starsContainer.appendChild(star);
        }

        // 音效控制 (戳紙聲)
        const soundBtn = document.getElementById('sound-btn');
        const soundIconOn = document.getElementById('sound-icon-on');
        const soundIconOff = document.getElementById('sound-icon-off');
        let soundEnabled = true;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTearSound() {
            if (!soundEnabled) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            try {
                const bufferSize = audioCtx.sampleRate * 0.5; 
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'highpass';
                filter.frequency.value = 1000;

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                
                noise.start();
            } catch(e) { console.log('Audio error'); }
        }

        function playWinSound() {
            if (!soundEnabled) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 1.5);
            } catch(e) {}
        }

        // 生成戳戳樂格子
        const gridContainer = document.getElementById('poke-grid');
        
        function initGrid() {
            gridContainer.innerHTML = '';
            const shuffledData = [...angelData].sort(() => Math.random() - 0.5);
            
            shuffledData.forEach((item, index) => {
                const cell = document.createElement('div');
                cell.className = 'poke-cell';
                cell.innerHTML = `
                    <div class="poke-hole">
                        <div class="poke-content">${item.number}</div>
                    </div>
                    <div class="poke-paper" data-n="${index + 1}"></div>
                `;
                
                cell.addEventListener('click', function() {
                    if (this.classList.contains('broken')) return;
                    
                    playTearSound();
                    this.classList.add('broken');
                    
                    setTimeout(() => {
                        playWinSound();
                        showResult(item);
                    }, 600);
                });
                
                gridContainer.appendChild(cell);
            });
        }
        
        initGrid();

        const resetBtn = document.getElementById('reset-btn');
        resetBtn.addEventListener('click', () => {
            initGrid();
        });

        // 彈窗邏輯
        const resultModal = document.getElementById('result-modal');
        const modalContent = document.getElementById('modal-content');
        const closeModal = document.getElementById('close-modal');
        const backBtn = document.getElementById('back-btn');

        function showResult(result) {
            document.getElementById('angel-number').textContent = result.number;
            document.getElementById('task-title').textContent = result.title;
            document.getElementById('frequency-code').textContent = result.code;
            document.getElementById('angel-whisper').textContent = result.whisper;
            document.getElementById('declutter-action').textContent = result.action;

            resultModal.classList.remove('hidden');
            void resultModal.offsetWidth;
            resultModal.classList.remove('opacity-0');
            modalContent.classList.remove('scale-95');
            modalContent.classList.add('scale-100');
        }

        function hideModal() {
            resultModal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                resultModal.classList.add('hidden');
            }, 300);
        }

        closeModal.addEventListener('click', hideModal);
        backBtn.addEventListener('click', hideModal);
        resultModal.addEventListener('click', (e) => {
            if (e.target === resultModal) hideModal();
        });

        soundBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            if(soundEnabled) {
                soundIconOn.classList.remove('hidden');
                soundIconOff.classList.add('hidden');
            } else {
                soundIconOn.classList.add('hidden');
                soundIconOff.classList.remove('hidden');
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        });

        // YouTube 播放器 Widget 邏輯
        const ytHeader = document.getElementById('yt-header');
        const ytContainer = document.getElementById('yt-player-container');
        const toggleIcon = document.getElementById('toggle-icon');
        let isMinimized = false;

        ytHeader.addEventListener('click', () => {
            isMinimized = !isMinimized;
            if (isMinimized) {
                ytContainer.classList.add('minimized');
                toggleIcon.classList.add('rotate-180');
            } else {
                ytContainer.classList.remove('minimized');
                toggleIcon.classList.remove('rotate-180');
            }
        });

    </script>
</body>
</html>
